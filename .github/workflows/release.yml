name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v6

      - name: Read Zig pin
        id: zig
        run: echo "version=$(tr -d '[:space:]' < .zig-version)" >> "$GITHUB_OUTPUT"

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ steps.zig.outputs.version }}

      - name: Check tag, version, and tests
        run: |
          scripts/version.sh --check
          zig build
          zig build test
          zig fmt --check build.zig build.zig.zon src
          bash -n release.sh
          bash -n scripts/version.sh
          bash -n scripts/smoke-release.sh
          bash -n scripts/homebrew-formula.sh
          zsh -n completions/_icloud-keychain
          python3 tests/cli_smoke.py zig-out/bin/icloud-keychain
          zsh tests/completions.zsh
          python3 tests/release_test.py
          python3 -m unittest discover -s tests -p 'test_integration_cleanup.py' -v

      - name: Decode signing certificate
        env:
          CERTIFICATE_P12: ${{ secrets.CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.CERTIFICATE_PASSWORD }}
        run: |
          echo "$CERTIFICATE_P12" | base64 --decode > certificate.p12
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"

          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain

          security import certificate.p12 -k build.keychain \
            -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/pkgbuild
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" build.keychain

          rm certificate.p12

      - name: Decode provisioning profile
        env:
          PROVISIONING_PROFILE: ${{ secrets.PROVISIONING_PROFILE }}
        run: echo "$PROVISIONING_PROFILE" | base64 --decode > DeveloperID.provisionprofile

      - name: Store notarization credentials
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          xcrun notarytool store-credentials "notary-profile" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD"

      - name: Build, sign, notarize, and package
        run: |
          chmod +x release.sh scripts/version.sh scripts/smoke-release.sh scripts/homebrew-formula.sh
          ./release.sh

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(scripts/version.sh)"
          PKG="release-build/icloud-keychain-${VERSION}-macos-universal.pkg"
          TAR="release-build/icloud-keychain-${VERSION}-macos-universal.tar.gz"
          FORMULA="release-build/icloud-keychain.rb"

          gh release create "$GITHUB_REF_NAME" \
            "$PKG" "$TAR" "$FORMULA" \
            --title "icloud-keychain v${VERSION}" \
            --generate-notes
